paths:
  /api/products/?{limit}:
    get:
      summary: Returns a list of products.
      tags:
        - Products
      parameters:
      - name: limit
        in: query
        required: true
        description: the number of items to return
        schema:
          type: integer  
      responses:
        "200":    
          description: A JSON array of product names
        "401":    
          description: The 'limit' parameter must be a number
        "402":    
          description: The 'limit' parameter must be a number greater than zero
        "500":
          description: Contact administrator
  /api/products/{pId}:
    get:
      summary: Get a product by ID
      tags:
        - Products
      parameters:
      - name: pId
        in: path
        required: true
        description: MongoDB product id        
        schema:
          type: string              
      responses:
        "200":
          description: MongoDB product data
        "404":
          description: The product with id doesn't exist  
        "500":
          description: Error interno del servidor 
  /api/products/{Id}:
    delete:
      summary: Delete a product by ID
      tags:
        - Products
      parameters:
      - name: Id
        in: path
        required: true
        description: MongoDB product id        
        schema:
          type: string              
      responses:
        "200":
          description: Deleted product
        "404":
          description: Error deleting product  
        "500":
          description: Contact administrator       
  /api/products/:                   
    post:
      summary: Save a product.
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/requestBodies/dataProduct'  
      responses:
        "200":
          description: Product created in DB
        "400":
          description: Error, code exists already exists in another product
        "500":
          description: Contact administrator
/api/products/{id}:                   
    put:
      summary: Update a product.
      tags:
        - Products
      parameters:
      - name: id
        in: path
        required: true
        description: MongoDB product id        
        schema:
          type: string 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#components/requestBodies/dataProduct'  
      responses:
        "200":
          description: Product updated in DB
        "400":
          description: Error, the required id is not in a valid MongoDB format
        "404":
          description: Error updating product not found  
        "500":
          description: Contact administrator          
components:
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: ObjectId
          description: Mongo autogenerated Id
        title:
          type: string
          description: Title product
        description:
          type: string
          description: Description product    
        code:
          type: string
          description: Code product
        price: 
          type: integer
          description: Price product  
        status:
          type: boolean
          description: Status product
        stock:
          type: integer
          description: Stock product    
        category:
          type: string
          description: Category product            
  requestBodies:
    dataProduct:
      type: object
      properties:
        title:
          type: string
          description: Title product
        description:
          type: string
          description:  Description product
        code:
          type: string
          description: Code product
        price:
          type: integer
          description: Price product
        status:
          type: boolean
          description: Status product
        stock:
          type: integer
          description: Stock product  
        category:
          type: string
          description: Category product    
      example:
        title: Titulo 20
        description: Descripción del 20!!
        code: bba jk567yuoddd000cba
        price: 1110
        status: true
        stock: 15
        category: Ingresando un nuevo producto mas, el veinte!!
