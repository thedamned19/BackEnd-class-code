components:
  schemas:
    Cart:
      type: object
      properties:
        _id:
          type: string
          description: DMongoDB I
        products:
          type: array
          items:
            $ref: "#/components/schemas/CartProducts"
        __v:
          type: number
          description: Document version in MongoDB
        createdAt:  
          type: date-time
          description: When it was created
        updatedAt:
          type: date-time
          description: When it was updated
      example:
        _id: 66352f1c2ffn6c530910125u
        products:
          - product:
              _id: 6262a4359a88d1aaa6e1fb4c
              status: true
              title: A B C
              description: AAA BBB CCC DDD EEE.
              price: 15600
              code: bba jk567yuoddd000cba
              stock: 14
              category: hola que tal
              owner: admin
              __v: 0
              createdAt: 2024-05-04T02:57:57.212Z
              updatedAt: 2024-05-04T02:57:57.212Z
            quantity: 11
            _id: bba jk567yuoddd000cba
        createdAt: 2024-05-03T18:38:20.276Z
        updatedAt: 2024-05-08T20:19:25.722Z
        __v: 1
    response400:
      type: object
      properties:
        code:
          type: string
          example: "UNAUTHORIZED_ERROR"
        message:
          type: string
          example: Error, enter a valid MongoDB Id format    
    response401:
      type: object
      properties:
        code:
          type: string
          example: "UNAUTHORIZED_ERROR"
        message:
          type: string
          example: The cart with id doesn't exist
    response402:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED_ERROR
        message:
          type: string
          example: "The product with id doesn't exist"          
    response500:
        type: object
        properties:
          code:
            type: string
            example: "INTERNAL_SERVER_ERROR"
          message:
            type: string
            example: "Contact administrator"
    CartProducts:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/Product"
          quantity:
            type: number
            description: Number of units of product in the cart
          _id:
            type: string
            description: MongoDB ID
    Product:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ID
        title:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price: 
          type: number
          description: Price of the product
        thumbnail:
          type: array
          items:
            type: string
          description: Product URL
        code:
          type: string
          description: Unique product code
        stock:
          type: number
          description: Available stock
        category:
          type: string
          description: Product Category
        owner:
          type: string
          description: Product Owner
        status:
          type: boolean
          description: Product status
        __v: 
          type: string
          description: Document version in MongoDB
        createdAt:  
          type: date-time
          description: When it was created
        updatedAt:
          type: date-time
          description: When was it updated
      example:
        _id: "6635a4359a91d1aaa6e1fb62"
        title: "Example title."
        description: "Example description."
        price: 57807
        thumbnail: ["https://auto.mercadolibre.com.uy/Ford Puma 0 km/imagen01.jpg"]
        code: "abcdef"
        stock: 3
        category: "car"
        owner: admin
        status: true
        __v: 0
        createdAt: "2024-08-04T02:57:57.213Z"
        updatedAt: "2024-08-05T23:25:08.867Z"        